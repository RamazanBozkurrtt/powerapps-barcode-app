Screens:
  scrResults:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      Height: =App.Height
      LoadingSpinnerColor: =RGBA(194, 65, 12, 1)
      OnVisible: |-
        =Set(varProductExpanded, false);
        Set(varExpandedItemNumber, Blank())
      Width: =App.Width
    Children:
    - lblResultsEyebrow:
        Control: Label@2.5.1
        Properties:
          Color: =RGBA(31, 41, 55, 1)
          DisabledColor: =RGBA(75, 85, 99, 1)
          Font: =Font.OpenSans
          FontWeight: =FontWeight.Semibold
          Height: =24
          PaddingBottom: =0
          PaddingLeft: =0
          PaddingRight: =0
          PaddingTop: =0
          Size: =14
          Text: ="STOK ASİSTANI"
          Visible: =false
          Width: =Parent.Width - 40
          X: =20
          Y: =16
    - btnResultsEmptyCard:
        Control: Classic/Button@2.2.0
        Properties:
          AccessibleLabel: =""
          BorderColor: =RGBA(229, 231, 235, 1)
          BorderThickness: =1
          Color: =RGBA(31, 41, 55, 1)
          DisabledBorderColor: =RGBA(229, 231, 235, 1)
          DisabledColor: =RGBA(75, 85, 99, 1)
          DisabledFill: =RGBA(243, 244, 246, 1)
          DisplayMode: =DisplayMode.Disabled
          Fill: =RGBA(255, 255, 255, 1)
          FocusedBorderColor: =RGBA(194, 65, 12, 1)
          FocusedBorderThickness: =3
          Font: =Font.OpenSans
          FontWeight: =FontWeight.Semibold
          Height: =390
          HoverBorderColor: =RGBA(194, 65, 12, 1)
          HoverColor: =RGBA(31, 41, 55, 1)
          HoverFill: =RGBA(255, 247, 237, 1)
          OnSelect: =false
          PressedBorderColor: =RGBA(194, 65, 12, 1)
          PressedColor: =RGBA(31, 41, 55, 1)
          PressedFill: =RGBA(255, 247, 237, 1)
          RadiusBottomLeft: =8
          RadiusBottomRight: =8
          RadiusTopLeft: =8
          RadiusTopRight: =8
          Size: =16
          TabIndex: =-1
          Text: =""
          Visible: =false
          Width: =Parent.Width - 64
          X: =32
          Y: =(210) + 64
          ZIndex: =6
    - btnResultsEmptyMark:
        Control: Classic/Button@2.2.0
        Properties:
          AccessibleLabel: =""
          BorderColor: =RGBA(229, 231, 235, 1)
          BorderThickness: =1
          Color: =RGBA(31, 41, 55, 1)
          DisabledBorderColor: =RGBA(229, 231, 235, 1)
          DisabledColor: =RGBA(75, 85, 99, 1)
          DisabledFill: =RGBA(243, 244, 246, 1)
          DisplayMode: =DisplayMode.Disabled
          Fill: =RGBA(255, 255, 255, 1)
          FocusedBorderColor: =RGBA(194, 65, 12, 1)
          FocusedBorderThickness: =3
          Font: =Font.OpenSans
          FontWeight: =FontWeight.Semibold
          Height: =64
          HoverBorderColor: =RGBA(194, 65, 12, 1)
          HoverColor: =RGBA(31, 41, 55, 1)
          HoverFill: =RGBA(255, 247, 237, 1)
          OnSelect: =false
          PressedBorderColor: =RGBA(194, 65, 12, 1)
          PressedColor: =RGBA(31, 41, 55, 1)
          PressedFill: =RGBA(255, 247, 237, 1)
          RadiusBottomLeft: =8
          RadiusBottomRight: =8
          RadiusTopLeft: =8
          RadiusTopRight: =8
          Size: =24
          TabIndex: =-1
          Text: ="⌕"
          Visible: =false
          Width: =64
          X: =(Parent.Width - Self.Width) / 2
          Y: =208
          ZIndex: =7
    - conResults:
        Control: GroupContainer@1.3.0
        Variant: AutoLayout
        Properties:
          BorderThickness: =0
          Fill: =RGBA(255, 255, 255, 1)
          FillPortions: =0
          Height: =Parent.Height
          LayoutAlignItems: =LayoutAlignItems.Stretch
          LayoutDirection: =LayoutDirection.Vertical
          LayoutGap: =8
          LayoutJustifyContent: =LayoutJustifyContent.Start
          LayoutMinHeight: =0
          LayoutMinWidth: =0
          LayoutMode: =LayoutMode.Auto
          LayoutOverflowX: =LayoutOverflow.Hide
          LayoutOverflowY: =LayoutOverflow.Hide
          LayoutWrap: =false
          PaddingBottom: =24
          PaddingLeft: =16
          PaddingRight: =16
          PaddingTop: =16
          Visible: =true
          Width: =Min(Parent.Width, 600)
          X: =(Parent.Width - Self.Width) / 2
          Y: =0
          ZIndex: =100
        Children:
        - conResultsHeader:
            Control: GroupContainer@1.3.0
            Variant: AutoLayout
            Properties:
              AlignInContainer: =AlignInContainer.Stretch
              BorderThickness: =0
              Fill: =RGBA(255, 255, 255, 1)
              FillPortions: =0
              Height: =48
              LayoutAlignItems: =LayoutAlignItems.Stretch
              LayoutDirection: =LayoutDirection.Horizontal
              LayoutGap: =8
              LayoutJustifyContent: =LayoutJustifyContent.Start
              LayoutMinHeight: =0
              LayoutMinWidth: =0
              LayoutMode: =LayoutMode.Auto
              LayoutOverflowX: =LayoutOverflow.Hide
              LayoutOverflowY: =LayoutOverflow.Hide
              LayoutWrap: =false
              PaddingBottom: =0
              PaddingLeft: =0
              PaddingRight: =0
              PaddingTop: =0
              Visible: =true
              Width: =Parent.Width - 32
              X: =0
              Y: =0
              ZIndex: =1
            Children:
            - lblResultsTitle:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =RGBA(31, 41, 55, 1)
                  DisabledColor: =RGBA(75, 85, 99, 1)
                  FillPortions: =1
                  Font: =Font.OpenSans
                  FontWeight: =FontWeight.Bold
                  Height: =48
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =18
                  Text: ="Depo stokları"
                  Width: =Parent.Width - 132
                  X: =0
                  Y: =0
                  ZIndex: =1
            - btnResultsScanAgain:
                Control: Classic/Button@2.2.0
                Properties:
                  AccessibleLabel: ="Yeni ürün ara"
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderColor: =RGBA(194, 65, 12, 1)
                  BorderThickness: =1
                  Color: =RGBA(194, 65, 12, 1)
                  DisabledBorderColor: =RGBA(229, 231, 235, 1)
                  DisabledColor: =RGBA(75, 85, 99, 1)
                  DisabledFill: =RGBA(243, 244, 246, 1)
                  DisplayMode: =DisplayMode.Edit
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  FocusedBorderColor: =RGBA(194, 65, 12, 1)
                  FocusedBorderThickness: =3
                  Font: =Font.OpenSans
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  HoverBorderColor: =RGBA(194, 65, 12, 1)
                  HoverColor: =RGBA(194, 65, 12, 1)
                  HoverFill: =RGBA(255, 247, 237, 1)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Set(varFlowCallStarted, false);
                    Navigate(scrScan, ScreenTransition.Fade)
                  PressedBorderColor: =RGBA(194, 65, 12, 1)
                  PressedColor: =RGBA(194, 65, 12, 1)
                  PressedFill: =RGBA(255, 247, 237, 1)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =12
                  TabIndex: =0
                  Text: ="Yeni ürün ara"
                  Visible: =true
                  Width: =124
                  X: =0
                  Y: =0
                  ZIndex: =2
        - lblResultsCount:
            Control: Label@2.5.1
            Properties:
              AlignInContainer: =AlignInContainer.Stretch
              Color: =RGBA(75, 85, 99, 1)
              DisabledColor: =RGBA(75, 85, 99, 1)
              FillPortions: =0
              Font: =Font.OpenSans
              Height: =24
              LayoutMinHeight: =0
              LayoutMinWidth: =0
              PaddingBottom: =0
              PaddingLeft: =0
              PaddingRight: =0
              PaddingTop: =0
              Size: =12
              Text: =If(CountRows(colProductGroups) = 0, "Sonuç bulunamadı", CountRows(colProductGroups) & " ürün
                bulundu")
              Width: =Parent.Width - 32
              X: =0
              Y: =0
              ZIndex: =2
        - galProducts:
            Control: Gallery@2.15.0
            Properties:
              AccessibleLabel: ="Ürünler. Ambar stoklarını görmek için ürün kartını açın."
              AlignInContainer: =AlignInContainer.Stretch
              AutoHeight: =true
              DelayItemLoading: =false
              Fill: =RGBA(249, 250, 251, 1)
              FillPortions: =1
              Height: =Max(0, Parent.Height - 128)
              Items: =colProductGroups
              LayoutMinHeight: =0
              LayoutMinWidth: =0
              Selectable: =false
              ShowScrollbar: =true
              TemplatePadding: =8
              TemplateSize: =84
              Visible: =CountRows(colProductGroups) > 0
              Width: =Parent.Width - 32
              X: =0
              Y: =0
              ZIndex: =3
            Variant: VariableHeight
            Children:
            - btnProductCard:
                Control: Classic/Button@2.2.0
                Properties:
                  AccessibleLabel: =Coalesce(ThisItem.ProductName, ThisItem.ItemNumber) & If(varExpandedItemNumber
                    = ThisItem.ItemNumber, ", açık. Kapat", ", kapalı. Ambarları göster")
                  BorderColor: =RGBA(229, 231, 235, 1)
                  BorderThickness: =1
                  Color: =RGBA(31, 41, 55, 1)
                  DisabledBorderColor: =RGBA(229, 231, 235, 1)
                  DisabledColor: =RGBA(75, 85, 99, 1)
                  DisabledFill: =RGBA(255, 255, 255, 1)
                  DisplayMode: =DisplayMode.View
                  Fill: =RGBA(255, 255, 255, 1)
                  FocusedBorderColor: =RGBA(194, 65, 12, 1)
                  FocusedBorderThickness: =3
                  Font: =Font.OpenSans
                  FontWeight: =FontWeight.Semibold
                  Height: =galWarehouses.Y + galWarehouses.Height + 8
                  HoverBorderColor: =RGBA(194, 65, 12, 1)
                  HoverColor: =RGBA(31, 41, 55, 1)
                  HoverFill: =RGBA(255, 247, 237, 1)
                  OnSelect: =false
                  PressedBorderColor: =RGBA(194, 65, 12, 1)
                  PressedColor: =RGBA(31, 41, 55, 1)
                  PressedFill: =RGBA(255, 247, 237, 1)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =16
                  TabIndex: =-1
                  Text: =""
                  Visible: =true
                  Width: =Parent.TemplateWidth - 8
                  X: =4
                  Y: =0
                  ZIndex: =1
            - lblProductName:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(31, 41, 55, 1)
                  DisabledColor: =RGBA(75, 85, 99, 1)
                  Font: =Font.OpenSans
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  OnSelect: |-
                    =Set(varProductExpanded, !varProductExpanded || varExpandedItemNumber <> ThisItem.ItemNumber);
                    Set(varExpandedItemNumber, ThisItem.ItemNumber)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =15
                  Text: =Coalesce(ThisItem.ProductName, ThisItem.ItemNumber, "Ürün")
                  Tooltip: =ThisItem.ProductName
                  Visible: =true
                  Width: =Parent.TemplateWidth - 76
                  X: =16
                  Y: =12
                  ZIndex: =2
            - lblProductNumber:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(75, 85, 99, 1)
                  DisabledColor: =RGBA(75, 85, 99, 1)
                  Font: =Font.OpenSans
                  FontWeight: =FontWeight.Normal
                  Height: =24
                  OnSelect: |-
                    =Set(varProductExpanded, !varProductExpanded || varExpandedItemNumber <> ThisItem.ItemNumber);
                    Set(varExpandedItemNumber, ThisItem.ItemNumber)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.ItemNumber & " · " & CountRows(Distinct(ThisItem.WarehouseRows, InventoryWarehouseId))
                    & " ambar"
                  Visible: =true
                  Width: =Parent.TemplateWidth - 32
                  X: =16
                  Y: =lblProductName.Y + lblProductName.Height + 4
                  ZIndex: =3
            - lblProductConflict:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(31, 41, 55, 1)
                  DisabledColor: =RGBA(75, 85, 99, 1)
                  Fill: =RGBA(255, 247, 237, 1)
                  Font: =Font.OpenSans
                  FontWeight: =FontWeight.Semibold
                  Height: =If(varProductExpanded && varExpandedItemNumber = ThisItem.ItemNumber && ThisItem.HasNameConflict,
                    48, 0)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: ="Bu ürün kodu için tutarsız ürün adları döndü."
                  Visible: =varProductExpanded && varExpandedItemNumber = ThisItem.ItemNumber && ThisItem.HasNameConflict
                  Width: =Parent.TemplateWidth - 32
                  X: =16
                  Y: =btnProductToggle.Height
                  ZIndex: =4
            - lblProductChevron:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(194, 65, 12, 1)
                  DisabledColor: =RGBA(75, 85, 99, 1)
                  Font: =Font.OpenSans
                  Height: =44
                  OnSelect: |-
                    =Set(varProductExpanded, !varProductExpanded || varExpandedItemNumber <> ThisItem.ItemNumber);
                    Set(varExpandedItemNumber, ThisItem.ItemNumber)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =24
                  Text: =If(varProductExpanded && varExpandedItemNumber = ThisItem.ItemNumber, "⌄", "›")
                  Visible: =true
                  Width: =44
                  X: =Parent.TemplateWidth - 56
                  Y: =8
                  ZIndex: =5
            - btnProductToggle:
                Control: Classic/Button@2.2.0
                Properties:
                  AccessibleLabel: =Coalesce(ThisItem.ProductName, ThisItem.ItemNumber) & If(varProductExpanded
                    && varExpandedItemNumber = ThisItem.ItemNumber, ", açık. Kapat", ", kapalı. Ambarları aç")
                  BorderColor: =If(ThisItem.IsProduct, RGBA(229, 231, 235, 1), RGBA(255, 255, 255, 1))
                  BorderThickness: =0
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(229, 231, 235, 1)
                  DisabledColor: =RGBA(55, 65, 81, 1)
                  DisabledFill: =RGBA(255, 255, 255, 1)
                  DisplayMode: =DisplayMode.Edit
                  Fill: =RGBA(255, 255, 255, 0)
                  FocusedBorderColor: =RGBA(194, 65, 12, 1)
                  FocusedBorderThickness: =3
                  Font: =Font.OpenSans
                  FontWeight: =FontWeight.Semibold
                  Height: =lblProductNumber.Y + lblProductNumber.Height + 12
                  HoverBorderColor: =RGBA(194, 65, 12, 1)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(255, 247, 237, 0.15)
                  OnSelect: |-
                    =Set(varProductExpanded, !varProductExpanded || varExpandedItemNumber <> ThisItem.ItemNumber);
                    Set(varExpandedItemNumber, ThisItem.ItemNumber)
                  PressedBorderColor: =RGBA(194, 65, 12, 1)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(255, 237, 213, 0.25)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =16
                  TabIndex: =0
                  Text: =""
                  Visible: =true
                  Width: =Parent.TemplateWidth - 8
                  X: =4
                  Y: =0
                  ZIndex: =20
            - galWarehouses:
                Control: Gallery@2.15.0
                Properties:
                  '#CopilotOverlayLabel': ="Filtrelenenler"
                  '#CopilotOverlayVisible': =false
                  AccessibleLabel: =""
                  AutoHeight: =false
                  BorderColor: =App.Theme.Colors.Darker40
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  ContentLanguage: =""
                  DelayItemLoading: =false
                  DisabledBorderColor: =Self.BorderColor
                  DisabledFill: =Self.Fill
                  DisplayMode: =DisplayMode.Edit
                  Fill: =RGBA(255, 255, 255, 1)
                  FocusedBorderColor: =Self.BorderColor
                  FocusedBorderThickness: =4
                  Height: =If(varProductExpanded && varExpandedItemNumber = ThisItem.ItemNumber, CountRows(ThisItem.WarehouseRows)
                    * 64, 0)
                  HoverBorderColor: =Self.BorderColor
                  HoverFill: =Self.Fill
                  Items: =ThisItem.WarehouseRows
                  Layout: =Layout.Vertical
                  LoadingSpinner: =LoadingSpinner.Data
                  LoadingSpinnerColor: =Self.BorderColor
                  MaxTemplateSize: =5000
                  NavigationStep: =1
                  PressedBorderColor: =Self.BorderColor
                  PressedFill: =Self.Fill
                  Reset: =false
                  Selectable: =true
                  SelectionTracksMove: =false
                  ShowNavigation: =false
                  ShowScrollbar: =false
                  TabIndex: =-1
                  TemplateMaximumWidth: =0
                  TemplatePadding: =0
                  TemplateSize: =64
                  Transition: =Transition.None
                  Visible: =varProductExpanded && varExpandedItemNumber = ThisItem.ItemNumber
                  Width: =Parent.TemplateWidth - 32
                  WrapCount: =1
                  X: =16
                  Y: =lblWarehouseHeading.Y + lblWarehouseHeading.Height
                  ZIndex: =5
                  maximumHeight: =768
                  maximumWidth: =1366
                  minimumHeight: =20
                  minimumWidth: =20
                Variant: Vertical
                Children:
                - lblWarehouseName:
                    Control: Label@2.5.1
                    Properties:
                      AutoHeight: =false
                      Color: =RGBA(31, 41, 55, 1)
                      DisabledColor: =RGBA(75, 85, 99, 1)
                      Font: =Font.OpenSans
                      FontWeight: =FontWeight.Semibold
                      Height: =48
                      PaddingBottom: =0
                      PaddingLeft: =0
                      PaddingRight: =0
                      PaddingTop: =0
                      Size: =13
                      Text: =ThisItem.InventoryWarehouseId
                      Tooltip: =ThisItem.InventoryWarehouseId
                      Visible: =true
                      Width: =Parent.TemplateWidth * 0.45
                      X: =0
                      Y: =8
                      ZIndex: =6
                - lblWarehouseAvailable:
                    Control: Label@2.5.1
                    Properties:
                      Align: =Align.Right
                      Color: =RGBA(31, 41, 55, 1)
                      DisabledColor: =RGBA(75, 85, 99, 1)
                      Font: =Font.OpenSans
                      FontWeight: =FontWeight.Semibold
                      Height: =24
                      PaddingBottom: =0
                      PaddingLeft: =0
                      PaddingRight: =0
                      PaddingTop: =0
                      Size: =12
                      Text: =IfError(Text(Value(ThisItem.AvailableOnHandQuantity), "0.########", "tr-TR"), "—")
                      Visible: =true
                      Width: =Parent.TemplateWidth * 0.55
                      X: =Parent.TemplateWidth * 0.45
                      Y: =8
                      ZIndex: =7
                - lblWarehouseReserved:
                    Control: Label@2.5.1
                    Properties:
                      Align: =Align.Right
                      Color: =RGBA(75, 85, 99, 1)
                      DisabledColor: =RGBA(75, 85, 99, 1)
                      Fill: =RGBA(255, 255, 255, 1)
                      Font: =Font.OpenSans
                      FontWeight: =FontWeight.Semibold
                      Height: =24
                      PaddingBottom: =0
                      PaddingLeft: =0
                      PaddingRight: =0
                      PaddingTop: =0
                      Size: =12
                      Text: '="Rezerve: " & IfError(Text(Value(ThisItem.ReservedOnHandQuantity), "0.########", "tr-TR"),
                        "—")'
                      Visible: =!IsBlank(ThisItem.ReservedOnHandQuantity) && ThisItem.ReservedOnHandQuantity <>
                        0
                      Width: =Parent.TemplateWidth * 0.55
                      X: =Parent.TemplateWidth * 0.45
                      Y: =32
                      ZIndex: =8
                - shpWarehouseDivider:
                    Control: Rectangle@2.3.0
                    Properties:
                      Fill: =RGBA(229, 231, 235, 1)
                      Height: =1
                      Visible: =true
                      Width: =Parent.TemplateWidth
                      X: =0
                      Y: =63
                      ZIndex: =9
            - lblWarehouseHeading:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Left
                  AutoHeight: =false
                  BorderColor: =App.Theme.Colors.Darker40
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  Color: =RGBA(194, 65, 12, 1)
                  ContentLanguage: =""
                  DisabledBorderColor: =RGBA(56, 56, 56, 1)
                  DisabledColor: =RGBA(75, 85, 99, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  DisplayMode: =DisplayMode.Edit
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderColor: =Self.BorderColor
                  FocusedBorderThickness: =0
                  Font: =Font.OpenSans
                  FontWeight: =FontWeight.Normal
                  Height: =If(varProductExpanded && varExpandedItemNumber = ThisItem.ItemNumber, 32, 0)
                  HoverBorderColor: =Self.BorderColor
                  HoverColor: =Self.Color
                  HoverFill: =Self.Fill
                  IsErrorMessage: =false
                  Italic: =false
                  LineHeight: =1.2
                  Live: =Live.Off
                  OnSelect: =false
                  Overflow: =Overflow.Hidden
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PressedBorderColor: =Self.BorderColor
                  PressedColor: =Self.Color
                  PressedFill: =Self.Fill
                  Role: =TextRole.Default
                  Size: =12
                  Strikethrough: =false
                  TabIndex: =-1
                  Text: ="Ambar"
                  Tooltip: =""
                  Underline: =false
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =varProductExpanded && varExpandedItemNumber = ThisItem.ItemNumber
                  Width: =(Parent.TemplateWidth - 32) * 0.45
                  Wrap: =true
                  X: =16
                  Y: =lblProductConflict.Y + lblProductConflict.Height
                  ZIndex: =3
                  maximumHeight: =7680
                  maximumWidth: =1366
                  minimumHeight: =1
                  minimumWidth: =1
            - lblAvailableHeading:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  AutoHeight: =false
                  BorderColor: =App.Theme.Colors.Darker40
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =0
                  Color: =RGBA(194, 65, 12, 1)
                  ContentLanguage: =""
                  DisabledBorderColor: =RGBA(56, 56, 56, 1)
                  DisabledColor: =RGBA(75, 85, 99, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  DisplayMode: =DisplayMode.Edit
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderColor: =Self.BorderColor
                  FocusedBorderThickness: =0
                  Font: =Font.OpenSans
                  FontWeight: =FontWeight.Normal
                  Height: =If(varProductExpanded && varExpandedItemNumber = ThisItem.ItemNumber, 32, 0)
                  HoverBorderColor: =Self.BorderColor
                  HoverColor: =Self.Color
                  HoverFill: =Self.Fill
                  IsErrorMessage: =false
                  Italic: =false
                  LineHeight: =1.2
                  Live: =Live.Off
                  OnSelect: =false
                  Overflow: =Overflow.Hidden
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PressedBorderColor: =Self.BorderColor
                  PressedColor: =Self.Color
                  PressedFill: =Self.Fill
                  Role: =TextRole.Default
                  Size: =12
                  Strikethrough: =false
                  TabIndex: =-1
                  Text: ="Kullanılabilir"
                  Tooltip: =""
                  Underline: =false
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =varProductExpanded && varExpandedItemNumber = ThisItem.ItemNumber
                  Width: =(Parent.TemplateWidth - 32) * 0.55
                  Wrap: =true
                  X: =16 + (Parent.TemplateWidth - 32) * 0.45
                  Y: =lblProductConflict.Y + lblProductConflict.Height
                  ZIndex: =3
                  maximumHeight: =7680
                  maximumWidth: =1366
                  minimumHeight: =1
                  minimumWidth: =1
        - lblResultsEmptyTitle:
            Control: Label@2.5.1
            Properties:
              Align: =Align.Center
              AlignInContainer: =AlignInContainer.Stretch
              AutoHeight: =true
              Color: =RGBA(31, 41, 55, 1)
              DisabledColor: =RGBA(75, 85, 99, 1)
              FillPortions: =0
              Font: =Font.OpenSans
              FontWeight: =FontWeight.Semibold
              Height: =64
              LayoutMinHeight: =0
              LayoutMinWidth: =0
              PaddingBottom: =0
              PaddingLeft: =0
              PaddingRight: =0
              PaddingTop: =0
              Size: =18
              Text: ="Eşleşen ürün bulunamadı"
              Visible: =CountRows(colProductGroups) = 0
              Width: =Parent.Width - 32
              X: =0
              Y: =0
              ZIndex: =4
        - lblResultsEmptyBody:
            Control: Label@2.5.1
            Properties:
              Align: =Align.Center
              AlignInContainer: =AlignInContainer.Stretch
              AutoHeight: =true
              Color: =RGBA(31, 41, 55, 1)
              DisabledColor: =RGBA(75, 85, 99, 1)
