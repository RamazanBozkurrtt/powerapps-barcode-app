        - conSearchForm:
            Control: GroupContainer@1.3.0
            Variant: AutoLayout
            Properties:
              AlignInContainer: =AlignInContainer.Stretch
              BorderThickness: =0
              Fill: =RGBA(255, 255, 255, 1)
              FillPortions: =0
              Height: =lblScanInstruction.Height + TextRecognizer1.Height + lblManualProductName.Height + txtProductName.Height
                + btnSearchProduct.Height + lblScanHint.Height + 60
              LayoutAlignItems: =LayoutAlignItems.Stretch
              LayoutDirection: =LayoutDirection.Vertical
              LayoutGap: =12
              LayoutJustifyContent: =LayoutJustifyContent.Start
              LayoutMinHeight: =0
              LayoutMinWidth: =0
              LayoutMode: =LayoutMode.Auto
              LayoutOverflowX: =LayoutOverflow.Hide
              LayoutOverflowY: =LayoutOverflow.Hide
              LayoutWrap: =false
              PaddingBottom: =0
              PaddingLeft: =0
              PaddingRight: =0
              PaddingTop: =0
              Visible: =true
              Width: =Parent.Width - 32
              X: =0
              Y: =0
              ZIndex: =2
            Children:
            - lblScanInstruction:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoHeight: =true
                  Color: =RGBA(75, 85, 99, 1)
                  DisabledColor: =RGBA(75, 85, 99, 1)
                  FillPortions: =0
                  Font: =Font.OpenSans
                  Height: =40
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: ="Etiketi fotoğraflayın veya ürün adı / kodunu yazın."
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  X: =0
                  Y: =0
                  ZIndex: =1
            - TextRecognizer1:
                Control: TextRecognizer@1.0.112
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderColor: =RGBA(194, 65, 12, 1)
                  BorderThickness: =0
                  ButtonHeight: =48
                  CommandBarFontSize: =14
                  CommandBarIconSize: =20
                  DefaultImage: =""
                  DisabledColor: =RGBA(75, 85, 99, 1)
                  DisabledFill: =RGBA(255, 255, 255, 1)
                  DisplayMode: =If(varScanAccepted, DisplayMode.Disabled, DisplayMode.Edit)
                  FillColor: =RGBA(194, 65, 12, 1)
                  FillPortions: =0
                  FontColor: =RGBA(255, 255, 255, 1)
                  Height: =48
                  ImageDisplayed: =false
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnChange: |-
                    =If(
                        varScanReady && App.ActiveScreen = scrScan && IsBlank(TextRecognizer1.OriginalImage),
                        Set(varScanEntryImage, "")
                    );
                    If(varScanReady && App.ActiveScreen = scrScan && !varScanAccepted && !varFlowCallStarted &&
                        IsBlank(TrimEnds(txtProductName.Text)) && !IsBlank(TextRecognizer1.OriginalImage) &&
                        TextRecognizer1.OriginalImage <> varScanEntryImage,
                        IfError(
                            With({ chosenText: With(
                        { readable: Filter(TextRecognizer1.Results, !IsBlank(TrimEnds(Text))) },
                        With(
                            { positioned: SortByColumns(
                                AddColumns(
                                    Filter(readable, !IsBlank(BoundingBox.Top) && BoundingBox.Top >= 0 &&
                                        !IsBlank(BoundingBox.Left) && BoundingBox.Left >= 0),
                                    OcrPage, Coalesce(PageNumber, 1),
                                    OcrTop, BoundingBox.Top,
                                    OcrRight, BoundingBox.Left + Max(0, Coalesce(BoundingBox.Width, 0))
                                ),
                                "OcrPage", SortOrder.Ascending, "OcrTop", SortOrder.Ascending,
                                "OcrRight", SortOrder.Descending, "Text", SortOrder.Ascending
                            ) },
                            If(IsEmpty(positioned), TrimEnds(First(readable).Text),
                                With({ anchor: First(positioned) },
                                    TrimEnds(First(SortByColumns(
                                        Filter(positioned, OcrPage = anchor.OcrPage &&
                                            OcrTop <= anchor.OcrTop + Max(0, Coalesce(anchor.BoundingBox.Height, 0)) / 2),
                                        "OcrRight", SortOrder.Descending, "OcrTop", SortOrder.Ascending,
                                        "Text", SortOrder.Ascending
                                    )).Text)
                                )
                            )
                        )
                    ) },
                                If(!IsBlank(chosenText),
                                    Set(varAcceptedText, chosenText);
                                    Set(varOcrEmpty, false);
                                    Set(varScanAccepted, true);
                                    Navigate(scrLoading, ScreenTransition.Fade),
                                    Set(varOcrEmpty, false)
                                )
                            ),
                            Set(varOcrEmpty, true)
                        )
                    )
                  ShowBoundingBoxes: =false
                  Text: ="Fotoğraf çek veya seç"
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  X: =0
                  Y: =0
                  ZIndex: =2
            - lblManualProductName:
