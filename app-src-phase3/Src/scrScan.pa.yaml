Screens:
  scrScan:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(194, 65, 12, 1)
      OnVisible: |-
        =Set(varScanAccepted, false);
        Set(varFlowCallStarted, false);
        Set(varLoadingExecutionStarted, false);
        Set(varOcrEmpty, false);
        Set(varAcceptedText, "");
        Set(varErrorMessage, "");
        Set(varResultJson, "");
        Reset(TextRecognizer1)
    Children:
    - btnScanBack:
        Control: Button@0.0.45
        Properties:
          AccessibleLabel: ="Ana sayfaya dön"
          Height: =48
          OnSelect: =Navigate(scrHome, ScreenTransition.Fade)
          Text: ="‹"
          Width: =48
          X: =24
          Y: =24
          BasePaletteColor: =RGBA(194, 65, 12, 1)
    - lblScanTitle:
        Control: Label@2.5.1
        Properties:
          Color: =RGBA(20, 27, 45, 1)
          FontWeight: =FontWeight.Bold
          Height: =48
          PaddingBottom: =0
          PaddingLeft: =0
          PaddingRight: =0
          PaddingTop: =0
          Size: =24
          Text: ="Ürün etiketini tara"
          Width: =Parent.Width - 120
          X: =88
          Y: =24
    - lblScanInstruction:
        Control: Label@2.5.1
        Properties:
          Color: =RGBA(91, 101, 120, 1)
          Height: =58
          PaddingBottom: =0
          PaddingLeft: =0
          PaddingRight: =0
          PaddingTop: =0
          Size: =14
          Text: ="Etiketi çekin veya bir görsel seçin. En üstteki metin ürün adı olarak otomatik alınır."
          VerticalAlign: =VerticalAlign.Top
          Width: =Parent.Width - 64
          X: =32
          Y: =96
    - lblScanGuideCaption:
        Control: Label@2.5.1
        Properties:
          Align: =Align.Center
          Color: =RGBA(194, 65, 12, 1)
          FontWeight: =FontWeight.Semibold
          Height: =34
          PaddingBottom: =0
          PaddingLeft: =0
          PaddingRight: =0
          PaddingTop: =0
          Size: =11
          Text: ="ETİKETİ BU ALANA HİZALAYIN"
          Width: =Parent.Width - 80
          X: =40
          Y: =174
    - btnScanSurface:
        Control: Button@0.0.45
        Properties:
          DisplayMode: =DisplayMode.Disabled
          Height: =650
          Text: =""
          Width: =Parent.Width - 64
          X: =32
          Y: =214
          Appearance: ="Secondary"
          BasePaletteColor: =RGBA(194, 65, 12, 1)
    - TextRecognizer1:
        Control: TextRecognizer@1.0.112
        Properties:
          BorderColor: =RGBA(254, 215, 170, 1)
          FillColor: =RGBA(194, 65, 12, 1)
          Height: =610
          Text: ="Görüntü çek veya seç"
          Width: =Parent.Width - 96
          X: =48
          Y: =234
          OnChange: |-
            =If(
                App.ActiveScreen = scrScan && !varScanAccepted && !varFlowCallStarted,
                IfError(
                    With(
                        {
                            candidates: SortByColumns(
                                AddColumns(
                                    Filter(
                                        TextRecognizer1.Results,
                                        !IsBlank(TrimEnds(Text)) &&
                                        !IsBlank(BoundingBox.Top) && BoundingBox.Top >= 0
                                    ),
                                    OcrTop, BoundingBox.Top,
                                    OcrLeft, Coalesce(BoundingBox.Left, 0),
                                    OcrPage, Coalesce(PageNumber, 1)
                                ),
                                "OcrTop", SortOrder.Ascending,
                                "OcrPage", SortOrder.Ascending,
                                "OcrLeft", SortOrder.Ascending,
                                "Text", SortOrder.Ascending
                            )
                        },
                        If(
                            IsEmpty(candidates),
                            Set(varAcceptedText, "");
                            Set(varOcrEmpty, true);
                            Notify("Okunabilir bir ürün adı bulunamadı. Etiketi netleştirip yeniden tarayın.", NotificationType.Warning),
                            Set(varAcceptedText, TrimEnds(First(candidates).Text));
                            Set(varOcrEmpty, false);
                            Set(varScanAccepted, true);
                            Navigate(scrLoading, ScreenTransition.Fade)
                        )
                    ),
                    Set(varAcceptedText, "");
                    Set(varOcrEmpty, true);
                    Notify("Görüntüdeki metin okunamadı. Lütfen yeniden tarayın.", NotificationType.Warning)
                )
            )
          ShowBoundingBoxes: =false
    - shpScanGuideTopLeft:
        Control: Rectangle@2.3.0
        Properties:
          Fill: =RGBA(194, 65, 12, 1)
          Height: =4
          Width: =76
          X: =48
          Y: =234
    - shpScanGuideTopRight:
        Control: Rectangle@2.3.0
        Properties:
          Fill: =RGBA(194, 65, 12, 1)
          Height: =4
          Width: =76
          X: =Parent.Width - 124
          Y: =234
    - shpScanGuideBottomLeft:
        Control: Rectangle@2.3.0
        Properties:
          Fill: =RGBA(194, 65, 12, 1)
          Height: =4
          Width: =76
          X: =48
          Y: =840
    - shpScanGuideBottomRight:
        Control: Rectangle@2.3.0
        Properties:
          Fill: =RGBA(194, 65, 12, 1)
          Height: =4
          Width: =76
          X: =Parent.Width - 124
          Y: =840
    - lblScanHint:
        Control: Label@2.5.1
        Properties:
          Align: =Align.Center
          Color: =RGBA(91, 101, 120, 1)
          Height: =72
          PaddingBottom: =0
          PaddingLeft: =16
          PaddingRight: =16
          PaddingTop: =0
          Size: =13
          Text: ="Seçim yapmanız gerekmez. Metin okunduğunda stok sorgusu otomatik başlar."
          VerticalAlign: =VerticalAlign.Top
          Visible: =!varOcrEmpty
          Width: =Parent.Width - 64
          X: =32
          Y: =900
    - btnScanEmptyCard:
