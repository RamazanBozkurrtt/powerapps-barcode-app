Screens:
  scrLoading:
    Properties:
      Fill: =RGBA(247, 249, 252, 1)
      LoadingSpinnerColor: =RGBA(37, 99, 235, 1)
      OnVisible: =false
    Children:
      - btnLoadingCard:
          Control: Button@0.0.45
          Properties:
            DisplayMode: =DisplayMode.Disabled
            Height: =520
            Text: =""
            Width: =Parent.Width - 64
            X: =32
            Y: =(Parent.Height - Self.Height) / 2
      - btnLoadingHalo:
          Control: Button@0.0.45
          Properties:
            DisplayMode: =DisplayMode.Disabled
            Height: =112
            Text: ="•••"
            Width: =112
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - 520) / 2 + 72
      - lblLoadingTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(20, 27, 45, 1)
            FontWeight: =FontWeight.Bold
            Height: =52
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =23
            Text: ="Stok bilgileri hazırlanıyor"
            Width: =Parent.Width - 112
            X: =56
            Y: =(Parent.Height - 520) / 2 + 218
      - lblLoadingBody:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(91, 101, 120, 1)
            Height: =72
            PaddingBottom: =0
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =0
            Size: =14
            Text: ="Depolardaki kullanılabilir ve rezerve miktarlar kontrol ediliyor."
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.Width - 112
            X: =56
            Y: =(Parent.Height - 520) / 2 + 286
      - lblLoadingProduct:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(37, 99, 235, 1)
            Fill: =RGBA(245, 248, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =48
            PaddingBottom: =0
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            Size: =13
            Text: =varAcceptedText
            Visible: =!IsBlank(varAcceptedText)
            Width: =Parent.Width - 176
            X: =88
            Y: =(Parent.Height - 520) / 2 + 384
      - tmrLoadingFlow:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =true
            AutoStart: =false
            Duration: =250
            OnTimerEnd: =false
            Repeat: =false
            Visible: =false
