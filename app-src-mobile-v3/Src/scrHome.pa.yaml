          Font: =Font.'Open Sans'
          Height: =60
          PaddingBottom: =0
          PaddingLeft: =16
          PaddingRight: =16
          PaddingTop: =0
          Size: =12
          Text: ="Kamera erişimi yalnızca ürün etiketini okumak için kullanılır."
          Width: =Parent.Width - 40
          X: =20
          Y: =btnScan.Y + btnScan.Height + 12
