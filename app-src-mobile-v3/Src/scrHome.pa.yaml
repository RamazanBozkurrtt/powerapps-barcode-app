    - btnScan:
        Control: Classic/Button@2.2.0
        Properties:
          AccessibleLabel: ="Ürün etiketini taramaya başla"
          BorderColor: =RGBA(194, 65, 12, 1)
          BorderThickness: =1
          Color: =RGBA(255, 255, 255, 1)
          DisabledBorderColor: =RGBA(229, 231, 235, 1)
          DisabledColor: =RGBA(75, 85, 99, 1)
          DisabledFill: =RGBA(243, 244, 246, 1)
          DisplayMode: =DisplayMode.Edit
          Fill: =RGBA(194, 65, 12, 1)
          FocusedBorderColor: =RGBA(194, 65, 12, 1)
          FocusedBorderThickness: =3
          Font: =Font.'Open Sans'
          FontWeight: =FontWeight.Semibold
          Height: =52
          HoverBorderColor: =RGBA(194, 65, 12, 1)
          HoverColor: =RGBA(255, 255, 255, 1)
          HoverFill: =RGBA(154, 52, 18, 1)
          OnSelect: |-
            =Set(varFlowCallStarted, false);
            Navigate(scrScan, ScreenTransition.Fade)
          PressedBorderColor: =RGBA(194, 65, 12, 1)
          PressedColor: =RGBA(255, 255, 255, 1)
          PressedFill: =RGBA(124, 45, 18, 1)
          RadiusBottomLeft: =12
          RadiusBottomRight: =12
          RadiusTopLeft: =12
          RadiusTopRight: =12
          Size: =16
          TabIndex: =0
          Text: ="Ürün ara"
          Visible: =true
          Width: =Parent.Width - 40
          X: =20
          Y: =Max(340, Parent.Height - 148)
          ZIndex: =9
    - lblHomeFooter:
        Control: Label@2.5.1
        Properties:
          Align: =Align.Center
          Color: =RGBA(75, 85, 99, 1)
