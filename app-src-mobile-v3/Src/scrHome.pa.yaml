Screens:
  scrHome:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      Height: =Max(App.Height, App.MinScreenHeight)
      LoadingSpinnerColor: =RGBA(194, 65, 12, 1)
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
    - shpHomeTopGlow:
        Control: Rectangle@2.3.0
        Properties:
          Fill: =RGBA(255, 255, 255, 1)
          Height: =220
          Width: =Parent.Width
    - lblHomeEyebrow:
        Control: Label@2.5.1
        Properties:
          Color: =RGBA(194, 65, 12, 1)
