scrLoading As screen:
    ContentLanguage: =""
    LoadingSpinnerColor: =RGBA(194, 65, 12, 1)
    OnVisible: =false

    btnLoadingCard As button:
        AccessibleLabel: =""
        BorderColor: =RGBA(229, 231, 235, 1)
        BorderThickness: =1
        Color: =RGBA(55, 65, 81, 1)
        DisabledBorderColor: =RGBA(229, 231, 235, 1)
        DisabledColor: =RGBA(55, 65, 81, 1)
        DisabledFill: =RGBA(255, 255, 255, 1)
        DisplayMode: =DisplayMode.Disabled
        Fill: =RGBA(255, 255, 255, 1)
        FocusedBorderColor: =RGBA(194, 65, 12, 1)
        FocusedBorderThickness: =3
        Font: =Font.OpenSans
        FontWeight: =FontWeight.Semibold
        Height: =520
        HoverBorderColor: =RGBA(194, 65, 12, 1)
        HoverColor: =RGBA(55, 65, 81, 1)
        HoverFill: =RGBA(255, 247, 237, 1)
        PressedBorderColor: =RGBA(194, 65, 12, 1)
        PressedColor: =RGBA(55, 65, 81, 1)
        PressedFill: =RGBA(255, 247, 237, 1)
        RadiusBottomLeft: =12
        RadiusBottomRight: =12
        RadiusTopLeft: =12
        RadiusTopRight: =12
        Size: =16
        TabIndex: =-1
        Text: =""
        Width: =Parent.Width - 64
        X: =32
        Y: =(Parent.Height - Self.Height) / 2
        ZIndex: =1

    btnLoadingHalo As button:
        AccessibleLabel: =""
        BorderColor: =RGBA(229, 231, 235, 1)
        BorderThickness: =1
        Color: =RGBA(55, 65, 81, 1)
        DisabledBorderColor: =RGBA(229, 231, 235, 1)
        DisabledColor: =RGBA(55, 65, 81, 1)
        DisabledFill: =RGBA(255, 255, 255, 1)
        DisplayMode: =DisplayMode.Disabled
        Fill: =RGBA(255, 255, 255, 1)
        FocusedBorderColor: =RGBA(194, 65, 12, 1)
        FocusedBorderThickness: =3
        Font: =Font.OpenSans
        FontWeight: =FontWeight.Semibold
        Height: =112
        HoverBorderColor: =RGBA(194, 65, 12, 1)
        HoverColor: =RGBA(55, 65, 81, 1)
        HoverFill: =RGBA(255, 247, 237, 1)
        PressedBorderColor: =RGBA(194, 65, 12, 1)
        PressedColor: =RGBA(55, 65, 81, 1)
        PressedFill: =RGBA(255, 247, 237, 1)
        RadiusBottomLeft: =12
        RadiusBottomRight: =12
        RadiusTopLeft: =12
        RadiusTopRight: =12
        Size: =16
        TabIndex: =-1
        Text: ="•••"
        Width: =112
        X: =(Parent.Width - Self.Width) / 2
        Y: =(Parent.Height - 520) / 2 + 72
        ZIndex: =2

    lblLoadingTitle As label:
        Align: =Align.Center
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(20, 27, 45, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =Font.OpenSans
        FontWeight: =FontWeight.Bold
        Height: =52
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        Size: =23
        Text: ="Stok bilgileri hazırlanıyor"
        Width: =Parent.Width - 112
        X: =56
        Y: =(Parent.Height - 520) / 2 + 218
        ZIndex: =3

    lblLoadingBody As label:
        Align: =Align.Center
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(91, 101, 120, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =Font.OpenSans
        Height: =72
        PaddingBottom: =0
        PaddingLeft: =16
        PaddingRight: =16
        PaddingTop: =0
        Text: ="Depolardaki kullanılabilir ve rezerve miktarlar kontrol ediliyor."
        VerticalAlign: =VerticalAlign.Top
        Width: =Parent.Width - 112
        X: =56
        Y: =(Parent.Height - 520) / 2 + 286
        ZIndex: =4

    lblLoadingProduct As label:
        Align: =Align.Center
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(194, 65, 12, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Fill: =RGBA(255, 247, 237, 1)
        Font: =Font.OpenSans
        FontWeight: =FontWeight.Semibold
        Height: =48
        PaddingBottom: =0
        PaddingLeft: =12
        PaddingRight: =12
        PaddingTop: =0
        Size: =13
        Text: =varAcceptedText
        Visible: =!IsBlank(varAcceptedText)
        Width: =Parent.Width - 176
        X: =88
        Y: =(Parent.Height - 520) / 2 + 384
        ZIndex: =5

    tmrLoadingFlow As timer:
        BorderColor: =App.Theme.Colors.Primary
        Color: =App.Theme.Colors.PrimaryForeground
        DisabledBorderColor: =RGBA(244, 244, 244, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        DisabledFill: =RGBA(244, 244, 244, 1)
        Duration: =250
        Fill: =App.Theme.Colors.Primary
        Font: =App.Theme.Font
        Height: =70
        HoverBorderColor: =App.Theme.Colors.Darker10
        HoverColor: =App.Theme.Colors.PrimaryForeground
        HoverFill: =App.Theme.Colors.Darker10
        OnTimerEnd: |-
            =If(
                App.ActiveScreen = scrLoading && varScanAccepted && !IsBlank(varAcceptedText) && !varFlowCallStarted && !varLoadingExecutionStarted,
                Set(varLoadingExecutionStarted, true);
                Set(varFlowCallStarted, true);
                IfError(
                    Set(varFlowResponse, barcode_flow.Run(varAcceptedText));
                    Set(varResultJson, varFlowResponse.result_json);
                    IfError(
                        ClearCollect(
                            colParsedRows,
                            ForAll(
                                Table(ParseJSON(varResultJson)) As row,
                                {
                                    ItemNumber: Text(row.Value.ItemNumber),
                                    ProductName: Text(row.Value.ProductName),
                                    InventoryWarehouseId: Text(row.Value.InventoryWarehouseId),
                                    AvailableOnHandQuantity: Coalesce(
                                        IfError(
                                            Value(row.Value.AvailableOnHandQuantity),
                                            Blank()
                                        ),
                                        0
                                    ),
                                    ReservedOnHandQuantity: Coalesce(
                                        IfError(
                                            Value(row.Value.ReservedOnHandQuantity),
                                            Blank()
                                        ),
                                        0
                                    )
                                }
                            )
                        );
                        ClearCollect(
                            colProductGroups,
                            AddColumns(
                                GroupBy(
                                    colParsedRows,
                                    ItemNumber,
                                    WarehouseRows
                                ) As ProductGroup,
                                ProductName,
                                First(ProductGroup.WarehouseRows).ProductName,
                                HasNameConflict,
                                CountRows(
                                    Distinct(
                                        ProductGroup.WarehouseRows,
                                        ProductName
                                    )
                                ) > 1
                            )
                        );
                        Navigate(scrResults, ScreenTransition.Fade),
                        Set(varErrorMessage, "Stok verisi işlenirken bir hata oluştu.");
                        Navigate(scrError, ScreenTransition.Fade)
                    ),
                    Set(varErrorMessage, "Stok bilgileri alınırken bir bağlantı hatası oluştu.");
                    Navigate(scrError, ScreenTransition.Fade)
                )
            )
        PressedBorderColor: =App.Theme.Colors.Darker40
        PressedColor: =Self.Color
        PressedFill: =App.Theme.Colors.Darker40
        Reset: =App.ActiveScreen <> scrLoading
        Start: =App.ActiveScreen = scrLoading && varScanAccepted && !IsBlank(varAcceptedText) && !varFlowCallStarted && !varLoadingExecutionStarted
        Visible: =false
        Width: =280
        ZIndex: =6

