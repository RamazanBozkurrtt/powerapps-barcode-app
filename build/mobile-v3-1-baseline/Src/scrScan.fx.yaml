    TextRecognizer1 As TextRecognizer:
        BorderColor: =RGBA(254, 215, 170, 1)
        BorderStyle: ="solid"
        BorderThickness: =1
        ButtonHeight: =70
        CommandBarFontSize: =20
        CommandBarIconSize: =24
        ContentLanguage: =""
        DefaultImage: =""
        DisabledBorderColor: =RGBA(166, 166, 166, 1)
        DisabledColor: =RGBA(55, 65, 81, 1)
        DisabledFill: =RGBA(255, 255, 255, 1)
        DisplayMode: =DisplayMode.Edit
        FillColor: =RGBA(194, 65, 12, 1)
        FontColor: =RGBA(255, 255, 255, 1)
        Height: =96
        ImageDisplayed: =false
        LoadSchema: =true
        OnChange: |-
            =If(
                varScanReady && App.ActiveScreen = scrScan && IsBlank(TextRecognizer1.OriginalImage),
                Set(varScanEntryImage, "")
            );
            If(
                varScanReady && App.ActiveScreen = scrScan && !varScanAccepted && !varFlowCallStarted &&
                !IsBlank(TextRecognizer1.OriginalImage) && TextRecognizer1.OriginalImage <> varScanEntryImage,
                IfError(
                    With(
                        {
                            candidates: SortByColumns(
                                AddColumns(
                                    Filter(
                                        TextRecognizer1.Results,
                                        !IsBlank(TrimEnds(Text)) &&
                                        !IsBlank(BoundingBox.Top) && BoundingBox.Top >= 0
                                    ),
                                    OcrTop, BoundingBox.Top,
                                    OcrLeft, Coalesce(BoundingBox.Left, 0),
                                    OcrPage, Coalesce(PageNumber, 1)
                                ),
                                "OcrTop", SortOrder.Ascending,
                                "OcrPage", SortOrder.Ascending,
                                "OcrLeft", SortOrder.Ascending,
                                "Text", SortOrder.Ascending
                            )
                        },
                        If(
                            IsEmpty(candidates),
                            Set(varAcceptedText, "");
                            Set(varOcrEmpty, true);
                            Notify("Okunabilir bir ürün adı bulunamadı. Etiketi netleştirip yeniden tarayın.", NotificationType.Warning),
                            Set(varAcceptedText, TrimEnds(First(candidates).Text));
                            Set(varOcrEmpty, false);
                            Set(varScanAccepted, true);
                            Navigate(scrLoading, ScreenTransition.Fade)
                        )
                    ),
                    Set(varAcceptedText, "");
                    Set(varOcrEmpty, true);
                    Notify("Görüntüdeki metin okunamadı. Lütfen yeniden tarayın.", NotificationType.Warning)
                )
            )
        ShouldReset: =true
        ShowBoundingBoxes: =false
        ShowControls: =true
        TabIndex: =0
        Text: ="Görüntü çek veya seç"
        Tooltip: =""
        Visible: =true
        Width: =Parent.Width - 96
        X: =48
        Y: =246
        ZIndex: =6

