        Set(varAcceptedText, "");
        Set(varErrorMessage, "");
        Set(varResultJson, "");
        Set(varScanEntryImage, TextRecognizer1.OriginalImage);
        Reset(TextRecognizer1);
        Set(varScanReady, true)
